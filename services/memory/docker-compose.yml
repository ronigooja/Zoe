services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    volumes:
      - type: bind
        source: ${ZOE_MEMORY_DATA_ROOT:?set a private memory data root}/qdrant
        target: /qdrant/storage
        bind:
          create_host_path: false

  memory-worker:
    build:
      context: ../..
      dockerfile: services/memory/Dockerfile
    environment:
      ZOE_MEMORY_API_TOKEN_FILE: /run/secrets/memory_api_token
      ZOE_MEMORY_API_ADDR: 0.0.0.0:8788
      ZOE_QDRANT_URL: http://qdrant:6333
      ZOE_MEM0_COLLECTION: zoe_mem0_v1
      ZOE_MEM0_LLM_PROVIDER: ${ZOE_MEM0_LLM_PROVIDER:-openai}
      ZOE_MEM0_LLM_MODEL: ${ZOE_MEM0_LLM_MODEL:?set ZOE_MEM0_LLM_MODEL}
      ZOE_MEM0_LLM_BASE_URL: ${ZOE_MEM0_LLM_BASE_URL:?set ZOE_MEM0_LLM_BASE_URL}
      ZOE_MEM0_LLM_API_KEY: ${ZOE_MEM0_LLM_API_KEY:?set ZOE_MEM0_LLM_API_KEY}
      ZOE_MEMORY_MODEL_CACHE: /var/lib/zoe/memory/models
      ZOE_MEM0_HISTORY_DB: /var/lib/zoe/memory/mem0-history.sqlite
    depends_on:
      - qdrant
    secrets:
      - memory_api_token
    volumes:
      - type: bind
        source: ${ZOE_MEMORY_DATA_ROOT:?set a private memory data root}
        target: /var/lib/zoe/memory
        bind:
          create_host_path: false

secrets:
  memory_api_token:
    file: ${ZOE_MEMORY_API_TOKEN_FILE:?set ZOE_MEMORY_API_TOKEN_FILE}
