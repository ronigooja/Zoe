name: zoe

services:
  zoe-server:
    image: ${ZOE_SERVER_IMAGE:?set ZOE_SERVER_IMAGE to an immutable release tag}
    user: "65532:65532"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ports:
      - "127.0.0.1:${ZOE_SERVER_PORT:-8787}:8787"
    environment:
      ZOE_LISTEN_ADDR: 0.0.0.0:8787
      ZOE_DATABASE_PATH: /var/lib/zoe/server/data/zoe.sqlite
      ZOE_RUNTIME_PROFILES: ${ZOE_RUNTIME_PROFILES:?set server-selected runtime profiles}
      ZOE_DEFAULT_PROFILE_ID: ${ZOE_DEFAULT_PROFILE_ID:?set default runtime profile}
      ZOE_MAX_RUNS: ${ZOE_MAX_RUNS:-12}
      ZOE_WAIT_LIMIT_MINUTES: ${ZOE_WAIT_LIMIT_MINUTES:-30}
      ZOE_RUNNER_ID: ${ZOE_RUNNER_ID:-configured-runner}
      ZOE_RUNNER_WORKSPACES: ${ZOE_RUNNER_WORKSPACES:-default}
      ZOE_RUNNER_SCOPES: ${ZOE_RUNNER_SCOPES:-runner:claim,runner:observe,runner:control:read}
      ZOE_CAPABILITY_RUNTIME_BACKEND: ${ZOE_CAPABILITY_RUNTIME_BACKEND:-}
      ZOE_AVAILABLE_CAPABILITY_IDS: ${ZOE_AVAILABLE_CAPABILITY_IDS:-}
      ZOE_MEMORY_RUNNER_TOKEN_FILE: /run/secrets/memory_runner_token
      ZOE_MEMORY_RUNNER_ID: ${ZOE_MEMORY_RUNNER_ID:-memory-worker}
      ZOE_MEMORY_RUNNER_WORKSPACES: ${ZOE_MEMORY_RUNNER_WORKSPACES:-default}
      ZOE_MEMORY_RUNNER_SCOPES: memory:jobs:claim,memory:jobs:complete,memory:propose
      ZOE_MEMORY_BATCH_INTERVAL_HOURS: ${ZOE_MEMORY_BATCH_INTERVAL_HOURS:-24}
      ZOE_MEM0_LLM_BASE_URL: ${ZOE_MEM0_LLM_BASE_URL:?set the existing external model gateway URL}
      ZOE_MEM0_LLM_MODEL: ${ZOE_MEM0_LLM_MODEL:?set a deployment-selected memory model}
      ZOE_MEM0_LLM_REASONING_EFFORT: ${ZOE_MEM0_LLM_REASONING_EFFORT:-}
      ZOE_MEM0_LLM_API_KEY_FILE: /run/secrets/mem0_llm_api_key
      ZOE_VOICE_GATEWAY_URL: ${ZOE_VOICE_GATEWAY_URL:-}
      ZOE_VOICE_UPSTREAM_ROUTE: ${ZOE_VOICE_UPSTREAM_ROUTE:-avas}
      ZOE_VOICE_CLASSIFICATION_TIMEOUT_MS: ${ZOE_VOICE_CLASSIFICATION_TIMEOUT_MS:-35000}
      ZOE_VOICE_INGEST_TOKEN_FILE: /run/secrets/voice_ingest_token
      ZOE_VOICE_INGEST_ID: ${ZOE_VOICE_INGEST_ID:-voice-gateway}
      ZOE_VOICE_INGEST_WORKSPACES: ${ZOE_VOICE_INGEST_WORKSPACES:-default}
      ZOE_VOICE_ACCOUNT_MEDIA_ENABLED: ${ZOE_VOICE_ACCOUNT_MEDIA_ENABLED:-false}
      ZOE_REGISTER_BASE_URL: ${ZOE_REGISTER_BASE_URL:?set routing model base URL}
      ZOE_REGISTER_MODEL: ${ZOE_REGISTER_MODEL:?set routing model}
      ZOE_REGISTER_REASONING_EFFORT: ${ZOE_REGISTER_REASONING_EFFORT:-}
      ZOE_REGISTER_THINKING: ${ZOE_REGISTER_THINKING:-}
      ZOE_REGISTER_TIMEOUT_MS: ${ZOE_REGISTER_TIMEOUT_MS:-30000}
      ZOE_REGISTER_API_KEY_FILE: /run/secrets/register_api_key
      ZOE_REGISTER_RAW_WINDOW_MINUTES: ${ZOE_REGISTER_RAW_WINDOW_MINUTES:-60}
      ZOE_COMPACT_BASE_URL: ${ZOE_COMPACT_BASE_URL:?set compaction model base URL}
      ZOE_COMPACT_MODEL: ${ZOE_COMPACT_MODEL:?set compaction model}
      ZOE_COMPACT_API_KEY_FILE: /run/secrets/compact_api_key
      ZOE_COMPACT_REASONING_EFFORT: ${ZOE_COMPACT_REASONING_EFFORT:-}
      ZOE_COMPACT_THINKING: ${ZOE_COMPACT_THINKING:-}
      ZOE_COMPACT_TIMEOUT_MS: ${ZOE_COMPACT_TIMEOUT_MS:-600000}
      ZOE_COMPACT_MAX_CHARACTERS: ${ZOE_COMPACT_MAX_CHARACTERS:-8000}
      ZOE_COMPACT_INTERVAL_MINUTES: ${ZOE_COMPACT_INTERVAL_MINUTES:-60}
      ZOE_STEWARD_BASE_URL: ${ZOE_STEWARD_BASE_URL:-}
      ZOE_VOICE_INSTRUCTION_TEXT: ${ZOE_VOICE_INSTRUCTION_TEXT:-}
      ZOE_STEWARD_API_STYLE: ${ZOE_STEWARD_API_STYLE:-}
      ZOE_STEWARD_MODEL: ${ZOE_STEWARD_MODEL:-}
      ZOE_STEWARD_REASONING_EFFORT: ${ZOE_STEWARD_REASONING_EFFORT:-}
      ZOE_STEWARD_THINKING: ${ZOE_STEWARD_THINKING:-}
      ZOE_STEWARD_TIMEOUT_MS: ${ZOE_STEWARD_TIMEOUT_MS:-30000}
      ZOE_STEWARD_API_KEY_FILE: /run/secrets/steward_api_key
      ZOE_ANSWER_BASE_URL: ${ZOE_ANSWER_BASE_URL:-}
      ZOE_ANSWER_MODEL: ${ZOE_ANSWER_MODEL:-}
      ZOE_ANSWER_REASONING_EFFORT: ${ZOE_ANSWER_REASONING_EFFORT:-}
      ZOE_ANSWER_THINKING: ${ZOE_ANSWER_THINKING:-}
      ZOE_ANSWER_TIMEOUT_MS: ${ZOE_ANSWER_TIMEOUT_MS:-8000}
      ZOE_ANSWER_API_KEY_FILE: /run/secrets/answer_api_key
      ZOE_RECALL_HOLDING_TEXT: ${ZOE_RECALL_HOLDING_TEXT:-}
      ZOE_SECRET_FILE_MAP: ZOE_RUNNER_TOKEN=/run/secrets/runner_token${ZOE_VOICE_SECRET_MAP:-}
    entrypoint: ["/usr/local/bin/zoe-secret-entrypoint"]
    command: ["/usr/local/bin/zoe-server"]
    volumes:
      - type: bind
        source: ${ZOE_SERVER_DATA_ROOT:?set a private server authority root}
        target: /var/lib/zoe/server
    secrets:
      - source: runner_token
        target: runner_token
      - source: memory_runner_token
        target: memory_runner_token
      - source: mem0_llm_api_key
        target: mem0_llm_api_key
      - source: voice_gateway_api_key
        target: voice_gateway_api_key
      - source: voice_ingest_token
        target: voice_ingest_token
      - source: register_api_key
        target: register_api_key
      - source: compact_api_key
        target: compact_api_key
      - source: steward_api_key
        target: steward_api_key
      - source: answer_api_key
        target: answer_api_key
    networks:
      - default

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /qdrant/storage:rw,noexec,nosuid,nodev,size=2g,mode=0700,uid=1000,gid=1000
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots

  zoe-memory-worker:
    image: ${ZOE_MEMORY_WORKER_IMAGE:?set an immutable memory worker image tag}
    user: "65532:65532"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    environment:
      HOME: /var/lib/zoe/memory
      ZOE_SECRET_FILE_MAP: ZOE_RUNNER_TOKEN=/run/secrets/memory_runner_token,ZOE_MEM0_LLM_API_KEY=/run/secrets/mem0_llm_api_key
      ZOE_CONTROL_URL: http://zoe-server:8787
      ZOE_QDRANT_URL: http://qdrant:6333
      ZOE_QDRANT_COLLECTION: zoe_memory_v1_paraphrase_multilingual_minilm_l12_384_faf4aa42
      ZOE_MEM0_COLLECTION: zoe_mem0_v1
      ZOE_MEM0_LLM_PROVIDER: ${ZOE_MEM0_LLM_PROVIDER:-openai}
      ZOE_MEM0_LLM_MODEL: ${ZOE_MEM0_LLM_MODEL:?set a deployment-selected memory model}
      ZOE_MEM0_LLM_REASONING_EFFORT: ${ZOE_MEM0_LLM_REASONING_EFFORT:-}
      ZOE_MEM0_LLM_BASE_URL: ${ZOE_MEM0_LLM_BASE_URL:?set the existing external model gateway URL}
      ZOE_MEMORY_MODEL_CACHE: /var/lib/zoe/memory/models
      ZOE_MEM0_HISTORY_DB: /var/lib/zoe/memory/mem0-history.sqlite
    volumes:
      - type: bind
        source: ${ZOE_MEMORY_DATA_ROOT:?set a private memory data root}
        target: /var/lib/zoe/memory
    secrets:
      - source: memory_runner_token
        target: memory_runner_token
      - source: mem0_llm_api_key
        target: mem0_llm_api_key
    depends_on:
      - qdrant
      - zoe-server

networks:
  default:
    name: zoe
    external: true

secrets:
  steward_api_key:
    file: ${ZOE_STEWARD_API_KEY_FILE:-/dev/null}
  runner_token:
    file: ${ZOE_RUNNER_TOKEN_FILE:?set a private runner token file path}
  memory_runner_token:
    file: ${ZOE_MEMORY_RUNNER_TOKEN_FILE:?set a distinct memory runner token file path}
  mem0_llm_api_key:
    file: ${ZOE_MEM0_LLM_API_KEY_FILE:?set a deployment-provided provider secret file path}
  voice_gateway_api_key:
    file: ${ZOE_VOICE_GATEWAY_API_KEY_FILE:-/dev/null}
  voice_ingest_token:
    file: ${ZOE_VOICE_INGEST_TOKEN_FILE:-/dev/null}
  register_api_key:
    file: ${ZOE_REGISTER_API_KEY_FILE:?set routing API key file path}
  compact_api_key:
    file: ${ZOE_COMPACT_API_KEY_FILE:?set compaction API key file path}
  answer_api_key:
    file: ${ZOE_ANSWER_API_KEY_FILE:-/dev/null}
