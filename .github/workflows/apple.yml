name: Apple build and tests

on:
  workflow_call:
    inputs:
      tests:
        type: boolean
        required: true
      macos:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Package the locally signed macOS app after all checks pass
        type: boolean
        default: false
      platform:
        description: Platform to build and publish
        type: choice
        required: true
        default: macos
        options: [macos]

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' || inputs.tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          CI_OUTPUT="$RUNNER_TEMP/zoe-apple/tests"
          echo "CI_OUTPUT=$CI_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$CI_OUTPUT/logs" "$HOME/environment/zoe-apple"
          echo "ZOE_BUILD_ROOT=$CI_OUTPUT/test-data" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            swift --version
          } > "$CI_OUTPUT/logs/environment.txt" 2>&1

      - name: Run Swift package tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path clients/apple/Packages/ZoeKit \
            --scratch-path "$CI_OUTPUT/swift-build" \
            --cache-path "$HOME/environment/zoe-apple/package-cache" \
            --config-path "$HOME/environment/zoe-apple/swift-config" \
            --security-path "$HOME/environment/zoe-apple/swift-security" \
            > "$CI_OUTPUT/logs/swift-tests.log" 2>&1 || {
              status=$?
              tail -n 80 "$CI_OUTPUT/logs/swift-tests.log"
              exit "$status"
            }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-tests-logs-${{ github.sha }}
          path: ${{ env.CI_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error

  macos:
    needs: [tests]
    if: ${{ !cancelled() && needs.tests.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.macos || inputs.platform == 'macos') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          CI_OUTPUT="$RUNNER_TEMP/zoe-apple/macos"
          echo "CI_OUTPUT=$CI_OUTPUT" >> "$GITHUB_ENV"
          mkdir -p "$CI_OUTPUT/logs" "$HOME/environment/zoe-apple"
          echo "ZOE_BUILD_ROOT=$CI_OUTPUT/test-data" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcode-select -p
            xcodebuild -version
            swift --version
          } > "$CI_OUTPUT/logs/environment.txt" 2>&1

      - name: Build unsigned macOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project clients/apple/Zoe.xcodeproj \
            -scheme ZoeMac -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$CI_OUTPUT/mac-derived" \
            -clonedSourcePackagesDirPath "$HOME/environment/zoe-apple/xcode-packages" \
            -packageCachePath "$HOME/environment/zoe-apple/package-cache" \
            CODE_SIGNING_ALLOWED=NO build \
            ZOE_SOURCE_REVISION="${GITHUB_SHA:0:12}" \
            > "$CI_OUTPUT/logs/macos-build.log" 2>&1 || {
              status=$?
              tail -n 80 "$CI_OUTPUT/logs/macos-build.log"
              exit "$status"
            }

      - name: Sign macOS app with the stable local identity
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.ZOE_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.ZOE_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          app="$CI_OUTPUT/mac-derived/Build/Products/Release/Zoe.app"
          keychain="$RUNNER_TEMP/zoe-signing.keychain-db"
          keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          echo "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/zoe-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/zoe-signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/zoe-signing.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > "$CI_OUTPUT/logs/codesign.log" 2>&1 || true
          # A self-signed certificate is not a valid identity, so select it by hash, not by name.
          identity="$(security find-certificate -c "Zoe Local Code Signing" -Z "$keychain" | awk '/SHA-1 hash:/{print $3}')"
          trap 'tail -n 20 "$CI_OUTPUT/logs/codesign.log" >&2; security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          test -n "$identity"
          codesign --force --deep --timestamp=none \
            --keychain "$keychain" --sign "$identity" \
            --identifier com.zoe.mac "$app" >> "$CI_OUTPUT/logs/codesign.log" 2>&1
          codesign --verify --deep --strict "$app" >> "$CI_OUTPUT/logs/codesign.log" 2>&1
          codesign -d -r- "$app" >> "$CI_OUTPUT/logs/codesign.log" 2>&1
          grep 'designated =>' "$CI_OUTPUT/logs/codesign.log"

      - name: Package macOS app
        if: github.event_name == 'workflow_dispatch' && inputs.release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT/artifacts"
          mkdir -p "$CI_OUTPUT/dmg-root"
          ditto "$CI_OUTPUT/mac-derived/Build/Products/Release/Zoe.app" \
            "$CI_OUTPUT/dmg-root/Zoe.app"
          ln -s /Applications "$CI_OUTPUT/dmg-root/Applications"
          hdiutil create -volname Zoe -srcfolder \
            "$CI_OUTPUT/dmg-root" \
            -ov -format UDRO "$CI_OUTPUT/artifacts/Zoe.dmg"
          (cd "$CI_OUTPUT/artifacts" && shasum -a 256 Zoe.dmg > SHA256SUMS)

      - name: Upload macOS app
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-macos-${{ github.sha }}
          path: ${{ env.CI_OUTPUT }}/artifacts
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-macos-logs-${{ github.sha }}
          path: ${{ env.CI_OUTPUT }}/logs
          retention-days: 7
          if-no-files-found: error

  apple-checks:
    name: Apple checks
    if: always()
    needs: [tests, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          TESTS_SELECTED: ${{ github.event_name == 'workflow_dispatch' || inputs.tests }}
          MACOS_SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.macos || inputs.platform == 'macos' }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        shell: bash
        run: |
          set -euo pipefail
          for check in TESTS MACOS; do
            selected_var="${check}_SELECTED"
            result_var="${check}_RESULT"
            expected=skipped
            if [[ "${!selected_var}" == true ]]; then expected=success; fi
            if [[ "${!result_var}" != "$expected" ]]; then
              echo "::error::$check returned ${!result_var}; expected $expected"
              exit 1
            fi
          done
